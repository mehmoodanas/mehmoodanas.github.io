<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
@font-face{font-family:Inter;src:url(inter.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Mono;src:url(mono.woff2) format('woff2');font-weight:100 800}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f6f5f2;font-family:Inter,system-ui,sans-serif;color:#15171c;position:relative}
.wash{position:absolute;inset:0;background:
 radial-gradient(closest-side at 78% 40%, rgba(14,107,120,.16), transparent 70%)
 }
.copy{position:absolute;left:84px;top:0;bottom:70px;width:620px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.mark{width:64px;height:64px;border-radius:18px;background:#0e6b78;color:#fff;display:grid;place-items:center;font-weight:700;font-size:24px;box-shadow:0 10px 20px -8px rgba(14,107,120,.6)}
.eyebrow{font-family:Mono,monospace;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#0a5560;display:flex;align-items:center;gap:14px}
.eyebrow:before{content:"";width:42px;height:3px;background:#0e6b78;border-radius:3px}
h1{margin:0;white-space:nowrap;font-size:80px;line-height:1;letter-spacing:-.04em;font-weight:720}
.role{font-size:31px;line-height:1.3;font-weight:600;color:#0a5560;letter-spacing:-.015em;max-width:560px}
.stage{position:absolute;right:92px;top:50%;width:400px;margin-top:-150px;height:300px;perspective:1400px}
.scene{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(-36deg)}
.slab{position:absolute;inset:0;border-radius:34px;border:1px solid rgba(21,23,28,.12);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 30px 44px -18px rgba(21,23,28,.3);display:flex;align-items:flex-end;padding:18px 24px;font-family:Mono,monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#5d6472}
.s1{transform:translateZ(0);background:radial-gradient(circle at 1px 1px, rgba(21,23,28,.16) 2px, transparent 2.5px) 0 0/30px 30px,linear-gradient(145deg,#fff,#ebe9e3)}
.s2{transform:translateZ(80px);background:linear-gradient(rgba(21,23,28,.09),rgba(21,23,28,.09)) 28px 28px/46% 12px no-repeat,linear-gradient(rgba(21,23,28,.07),rgba(21,23,28,.07)) 28px 56px/62% 12px no-repeat,linear-gradient(rgba(21,23,28,.07),rgba(21,23,28,.07)) 28px 84px/34% 12px no-repeat,linear-gradient(145deg,#fff,#f1efea)}
.s3{transform:translateZ(160px);border-color:rgba(14,107,120,.55);background:linear-gradient(145deg,#2a8391,#0e6b78 55%,#0a5560);color:rgba(255,255,255,.85);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 36px 50px -18px rgba(14,107,120,.55)}
.floor{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(closest-side,rgba(21,23,28,.25),transparent 72%);filter:blur(24px);transform:translateZ(-60px)}
.url{position:absolute;left:84px;bottom:54px;font-family:Mono,monospace;font-size:20px;color:#5d6472;letter-spacing:.02em}
</style></head>
<body>
<div class="wash"></div>
<div class="copy">
  <div class="mark">AM</div>
  <div class="eyebrow">Riga, Latvia</div>
  <h1>Anas Mehmood</h1>
  <div class="role">Computer Systems graduate · Applied machine learning &amp; AI systems</div>
</div>
<div class="stage"><div class="scene"><div class="floor"></div><div class="slab s1">model</div><div class="slab s2">service</div><div class="slab s3">tests</div></div></div>
<div class="url">mehmoodanas.github.io</div>
</body></html>
