# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: Repository → Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Worked out automatically from the repository:
      #   <user>.github.io repository  ->  https://<user>.github.io/
      #   any other repository "name"  ->  https://<user>.github.io/name/
      # To override (for example with your own domain), add repository variables
      # SITE_URL and BASE_PATH under Settings → Secrets and variables → Actions → Variables.
      # The build and the verify step below must see the same values.
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      BASE_PATH: ${{ vars.BASE_PATH || (endsWith(github.repository, '.github.io') && '/' || format('/{0}', github.event.repository.name)) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run verify

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
